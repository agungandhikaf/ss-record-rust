[package]
name = "flow-screenshot-recorder-tauri"
version = "1.0.3"
description = "Manual screenshot recorder per TC folder using Tauri + Rust"
authors = ["Teman Akun"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
image = "0.24"
open = "5"
screenshots = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "1.6", features = ["api-all"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
