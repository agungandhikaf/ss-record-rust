name: Build Tauri Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            build_command: npm run dist:win
            artifact_name: flow-screenshot-recorder-windows
          - name: macOS
            os: macos-latest
            build_command: npm run dist:mac
            artifact_name: flow-screenshot-recorder-macos

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build installer
        run: ${{ matrix.platform.build_command }}

      - name: Rename installer artifact
        shell: bash
        run: |
          # [VERSIONED_INSTALLER_FILENAME_FIX] Keep GitHub artifact filenames consistent with release filenames.
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "${GITHUB_REF_NAME:-}" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi

          mkdir -p release-assets
          shopt -s nullglob

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            files=(src-tauri/target/release/bundle/nsis/*.exe)
            if [[ ${#files[@]} -eq 0 ]]; then
              echo "No Windows NSIS .exe installer found."
              exit 1
            fi
            cp "${files[0]}" "release-assets/MyScreenshots_x64_v.${VERSION}.exe"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            files=(src-tauri/target/release/bundle/dmg/*.dmg)
            if [[ ${#files[@]} -eq 0 ]]; then
              echo "No macOS .dmg installer found."
              exit 1
            fi
            cp "${files[0]}" "release-assets/MyScreenshots_mac_v.${VERSION}.dmg"
          else
            echo "Unsupported runner OS: $RUNNER_OS"
            exit 1
          fi

          ls -la release-assets

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: release-assets/*
          if-no-files-found: error
