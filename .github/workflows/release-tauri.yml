name: Release Tauri Installers

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Rename Windows installer
        shell: bash
        run: |
          # [VERSIONED_INSTALLER_FILENAME_FIX] Release asset filename follows the pushed tag, for example v1.0.8 -> v.1.0.8.
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "${GITHUB_REF_NAME:-}" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi

          mkdir -p release-assets
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/nsis/*.exe)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No Windows NSIS .exe installer found."
            exit 1
          fi
          cp "${files[0]}" "release-assets/MyTBC_x64_v.${VERSION}.exe"
          ls -la release-assets

      - name: Upload Windows installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*

  build-mac:
    name: Build Mac DMG
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Mac installer
        run: npm run dist:mac

      - name: Rename Mac installer
        run: |
          # [VERSIONED_INSTALLER_FILENAME_FIX] Release asset filename follows the pushed tag, for example v1.0.8 -> v.1.0.8.
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${GITHUB_REF_NAME:-}" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi

          mkdir -p release-assets
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS .dmg installer found."
            exit 1
          fi
          cp "${files[0]}" "release-assets/MyTBC_mac_v.${VERSION}.dmg"
          ls -la release-assets

      - name: Upload Mac installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
