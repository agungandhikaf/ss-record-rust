name: Release Tauri Installers

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Rename Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          Copy-Item $exe.FullName "release-assets/Flow_Screenshot_Recorder_windows_x64_setup.exe"

      - name: Upload Windows installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Flow_Screenshot_Recorder_windows_x64_setup.exe

  build-mac:
    name: Build Mac DMG
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Mac installer
        run: npm run dist:mac

      - name: Rename Mac installer
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/dmg/*.dmg release-assets/Flow_Screenshot_Recorder_mac.dmg

      - name: Upload Mac installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Flow_Screenshot_Recorder_mac.dmg