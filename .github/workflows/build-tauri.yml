name: Build Tauri Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Rename Windows installer
        shell: bash
        run: |
          # [VERSIONED_INSTALLER_FILENAME_FIX] GitHub branch build artifact uses app version from package.json.
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/nsis/*.exe)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No Windows NSIS .exe installer found."
            exit 1
          fi
          cp "${files[0]}" "release-assets/MyScreenshots_x64_v.${VERSION}.exe"
          ls -la release-assets

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-installer
          if-no-files-found: error
          path: release-assets/*

  build-mac:
    name: Build Mac DMG
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm install

      - name: Build Mac installer
        run: npm run dist:mac

      - name: Rename Mac installer
        run: |
          # [VERSIONED_INSTALLER_FILENAME_FIX] GitHub branch build artifact uses app version from package.json.
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p release-assets
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS .dmg installer found."
            exit 1
          fi
          cp "${files[0]}" "release-assets/MyScreenshots_mac_v.${VERSION}.dmg"
          ls -la release-assets

      - name: Upload Mac installer
        uses: actions/upload-artifact@v4
        with:
          name: tauri-mac-installer
          if-no-files-found: error
          path: release-assets/*
